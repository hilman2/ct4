[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# Der Distributionsname, nicht der Importname. Importiert wird weiter
# "Cheetah", und das muss so bleiben: weewx schreibt
# "from Cheetah.Template import Template", und daran haengt die ganze
# Kompatibilitaetszusage. "ct4" ist auf PyPI vergeben, an ein fremdes
# Projekt, und PyPI normalisiert Namen, also waere "CT4" derselbe.
#
# Achtung, gemessen: CT3 und diese Distribution beanspruchen beide das
# Importpaket "Cheetah". Nebeneinander installiert ueberschreibt die
# zuletzt installierte die Dateien der anderen, ohne dass pip etwas
# sagt. ct4.engine prueft das zur Laufzeit.
name = "Cheetah4"
description = "Cheetah 4, a template engine and code generation tool"
readme = { file = "README.rst", content-type = "text/x-rst" }
# Lesser, weil Cheetah eine Bibliothek ist, die andere Programme in
# sich einbauen. Unter der gewoehnlichen GPL muesste jedes davon selbst
# GPL-vertraeglich sein. Beide Texte gehoeren dazu: die Lesser-Lizenz
# ist eine Zusatzerlaubnis auf die GPL und steht nicht fuer sich.
# LICENSE traegt ausserdem den MIT-Vermerk von Cheetah3 weiter, den die
# MIT-Lizenz zu erhalten verlangt.
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "COPYING", "COPYING.LESSER"]
# Python 2 ist raus. Seine Kompatibilitaetsschicht zog sich durch den
# ganzen Code und stand jeder Modernisierung im Weg. 3.10 ist die
# Untergrenze, weil erst dort `X | Y` als Annotation und `match`
# verfuegbar sind.
requires-python = ">=3.10"
dynamic = ["version"]
keywords = ["template", "json", "weewx"]
authors = [{ name = "Tavis Rudd", email = "tavis@damnsimple.com" }]
maintainers = [{ name = "Oleg Broytman", email = "phd@phdru.name" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing",
]

[project.urls]
Homepage = "https://cheetahtemplate.org/"
Source = "https://github.com/CheetahTemplate3/cheetah3"

[project.optional-dependencies]
filters = ["markdown"]
markdown = ["markdown"]
# Die statische Schemapruefung braucht nichts. Nur die Pruefung des
# fertigen Ergebnisses zur Laufzeit braucht eine Bibliothek.
schema = ["jsonschema"]

[project.scripts]
# Frueher unter Windows Entry Points und sonst Skripte in bin/. Entry
# Points koennen beides, und der Unterschied war nur eine Altlast.
cheetah = "Cheetah.CheetahWrapper:_cheetah"
cheetah-compile = "Cheetah.CheetahWrapper:_cheetah_compile"
cheetah-analyze = "Cheetah.DirectiveAnalyzer:main"
ct4 = "ct4.cli:main"

[project.entry-points."ct4.plugins"]
# Das erste Plugin. Es gehoert eigentlich in ein eigenes Paket
# ct4-weewx; solange es das nicht gibt, liegt es hier und meldet sich
# nur an, wenn weewx installiert ist.
weewx = "ct4.plugins.weewx_adapter"

[tool.setuptools.dynamic]
version = { attr = "Cheetah.Version.Version" }

# Gesucht statt aufgezaehlt. Die Liste war von ct3 geerbt und kannte
# ct4 nicht: das gebaute Wheel enthielt 72 Cheetah-Module und null
# ct4-Module, waehrend [project.scripts] einen Befehl ct4 versprach und
# der Eintragspunkt auf ct4.plugins.weewx_adapter zeigte. Beides waere
# beim ersten Aufruf mit ModuleNotFoundError gestorben.
#
# Die Muster schliessen tests/ aus, weil es kein Paket ist und oben
# auch nicht liegt.
[tool.setuptools.packages.find]
include = ["Cheetah*", "ct4*"]

[tool.setuptools.package-data]
Cheetah = ["*.tmpl", "*.txt"]
# Die Deklarationen sind zur Laufzeit noetig, nicht nur beim Bauen:
# ohne sie prueft "ct4 check" gegen nichts und meldet keinen Befund.
ct4 = ["declarations/*.json"]

[tool.pytest.ini_options]
# Ein haengender Test soll fehlschlagen und sagen wo, statt den Lauf mit
# SIGKILL zu beenden.
timeout = 60
testpaths = ["tests/unit"]

[tool.ruff]
# Die Zeilenlaenge des Bestands, nicht die Vorgabe von ruff. Ein
# Formatierungslauf ueber fremden Code macht jeden Diff unlesbar.
line-length = 79
extend-exclude = [
    "Cheetah/Templates/SkeletonPage.py",
    "Cheetah/Tests/test_abs_import.py",
]

[tool.ruff.lint]
# Genau die Regelfamilien, die das Projekt mit flake8 hatte: pycodestyle
# und pyflakes. ruffs Vorgabe bringt weitere mit und meldete 785 Stellen
# in fremdem Code. Was davon uebernommen wird, ist eine Entscheidung fuer
# sich und gehoert nicht in einen Umbau des Build-Systems.
select = ["E", "W", "F"]
# W605: ungueltige Escape-Sequenz. Steht in den Regexen des Parsers und
# wird bei dessen Umbau in P4 erledigt, nicht nebenbei.
ignore = ["W605"]

[tool.mypy]
# Nur der neue Teilbaum. Cheetah selbst hat keine Annotationen, und eine
# halbe Nachruestung sieht nach Abdeckung aus, wo keine ist.
files = ["ct4"]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
# Cheetah und weewx sind fuer die Typpruefung fremde, unannotierte
# Bibliotheken. Ihnen hinterherzulaufen ergaebe dreitausend Meldungen
# ueber Code, den P1 ausdruecklich nicht anfasst.
module = ["Cheetah.*", "weewx.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.cibuildwheel]
# Nur CPython. PyPy bringt keinen Vorteil, weil dort die C-Erweiterung
# ueber cpyext laeuft und langsamer ist als der reine Python-Pfad.
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
# musllinux bleibt drin: weewx laeuft in Alpine-Containern, und ohne
# Wheel baut der Container die C-Erweiterung selbst oder laeuft ohne
# sie. Entschieden am 02-Sep-2026 (PLAN.md, Abschnitt 15).
skip = "*_i686 *-win32"
# Python 3.14 ohne GIL. Der NameMapper ist die Stelle, an der sich das
# zeigen wird, deshalb wird von Anfang an dafuer gebaut.
enable = ["cpython-freethreading"]
# Ein Wheel ohne uebersetzten NameMapper sieht heil aus und misst
# hinterher eine andere Semantik: ct3 schaltet dann still
# useStackFrames ab.
test-command = "python -c \"from Cheetah import NameMapper; assert NameMapper.C_VERSION\""
