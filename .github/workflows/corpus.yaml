name: Corpus

# Checks whether ct4 delivers the same output as the shipped ct3, and
# runs linter, type check and both test suites. It runs through the same
# compose file as locally, so that the environment is described in
# exactly one place.

on: [push, pull_request]

jobs:
  alles:
    name: Lint, tests, corpus
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker compose -f tests/docker/compose.yml run --rm tests
