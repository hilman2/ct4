name: Korpus

# Prueft, ob ct4 dieselbe Ausgabe liefert wie das ausgelieferte ct3, und
# laesst Linter, Typpruefung und beide Testsuiten laufen. Gelaufen wird
# ueber dieselbe Compose-Datei wie lokal, damit die Umgebung an genau
# einer Stelle beschrieben ist.

on: [push, pull_request]

jobs:
  alles:
    name: Lint, Tests, Korpus
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker compose -f tests/docker/compose.yml run --rm tests
