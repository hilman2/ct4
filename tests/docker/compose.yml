# All:   docker compose -f tests/docker/compose.yml run --rm tests
# Corpus only:  ... run --rm tests corpus
services:
  tests:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # The sources stay untouched. Building and writing happen only in
      # the tmpfs under /work.
      - ../..:/repo:ro
    tmpfs:
      # uid/gid, because the run does not happen as root and a tmpfs
      # would otherwise belong to root.
      - /work:exec,size=512m,uid=1000,gid=1000
    working_dir: /work
    environment:
      PYTHONUNBUFFERED: "1"

  # Record contexts from a real weewx run:
  #   docker compose -f tests/docker/compose.yml run --rm capture
  capture:
    build:
      context: .
      dockerfile: Dockerfile.capture
    volumes:
      - ../..:/repo:ro
      - ../../corpus/fixtures:/out
    tmpfs:
      - /work:exec,size=512m,uid=1000,gid=1000
    environment:
      PYTHONUNBUFFERED: "1"
